[pytest]
testpaths = tests
# Without this, `pytest` (the console script) never puts backend/ on
# sys.path, so conftest.py's `from app.config import get_settings` fails
# with ModuleNotFoundError — `python -m pytest` masks this locally because
# -m adds the cwd to sys.path itself, but CI (and most people) just run
# `pytest`. See CI job backend-tests.
pythonpath = .
