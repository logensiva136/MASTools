- code: MASVS-RESILIENCE-1
  category: RESILIENCE
  title: The app validates the integrity of the platform.
  description: Running on a platform that has been tampered with can be very dangerous
    for apps, as this may disable certain security features, putting the data of
    the app at risk. Trusting the platform is essential for many of the MASVS controls
    relying on the platform being secure (e.g. secure storage, biometrics, sandboxing,
    etc.). This control tries to validate that the OS has not been compromised and
    its security features can thus be trusted.
