- code: MASVS-PRIVACY-1
  category: PRIVACY
  title: The app minimizes access to sensitive data and resources.
  description: 'Apps should only request access to the data they absolutely need
    for their functionality and always with informed consent from the user. This
    control ensures that apps practice data minimization and restricts access control,
    reducing the potential impact of data breaches or leaks.


    Furthermore, apps should share data with third parties only when necessary,
    and this should include enforcing that third-party SDKs operate based on user
    consent, not by default or without it. Apps should prevent third-party SDKs
    from ignoring consent signals or from collecting data before consent is confirmed.


    Additionally, apps should be aware of the ''supply chain'' of SDKs they incorporate,
    ensuring that no data is unnecessarily passed down their chain of dependencies.
    This end-to-end responsibility for data aligns with recent SBOM regulatory requirements,
    making apps more accountable for their data practices.'
  mastg_tests:
  - MASTG-TEST-0206
  - MASTG-TEST-0254
  - MASTG-TEST-0255
  - MASTG-TEST-0256
  - MASTG-TEST-0257
