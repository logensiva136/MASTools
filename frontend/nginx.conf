# Serves the built SPA. Any path that isn't a real static file falls back
# to index.html so react-router's client-side routes (e.g. /projects/123)
# work on a hard refresh or direct link, not just client-side navigation.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (Vite's default) are safe to cache hard;
    # index.html itself must not be, or a redeploy won't be picked up.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
