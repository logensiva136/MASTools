name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend + test dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        working-directory: backend
        run: pytest -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev compose file
        run: |
          cp .env.example .env
          sed -i 's/^SECRET_KEY=$/SECRET_KEY=ci-check-secret/' .env
          docker compose -f docker-compose.yml config -q
      - name: Validate prod compose file
        run: |
          cp .env.example .env
          sed -i \
            -e 's/^SECRET_KEY=$/SECRET_KEY=ci-check-secret/' \
            -e 's/^POSTGRES_PASSWORD=change-me$/POSTGRES_PASSWORD=ci-check-pw/' \
            -e 's/^BACKEND_CORS_ORIGINS=.*$/BACKEND_CORS_ORIGINS=https:\/\/app.example.com/' \
            .env
          echo "PUBLIC_API_BASE_URL=https://api.example.com" >> .env
          docker compose -f docker-compose.prod.yml config -q
